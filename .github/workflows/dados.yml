name: Atualizar dados reais
# Baixa resultados reais, treina os modelos quando preciso e publica os JSON no ramo "data".
# O site no Netlify le esses arquivos; nada aqui gera custo (repositorio publico).
on:
  schedule:
    - cron: "17 9,15,21,3 * * *"   # 06h17, 12h17, 18h17 e 00h17 em Brasilia
  push:
    branches: [main]
    paths: ["sofasd/**", ".github/workflows/dados.yml", "requirements-app.txt"]
  workflow_dispatch:
    inputs:
      treinar:
        description: "Treinar os modelos de novo"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Sao_Paulo
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: pip install -r requirements-app.txt
      - name: Recuperar banco e modelos da execucao anterior
        uses: actions/cache/restore@v4
        with:
          path: data
          key: sofa-data-${{ github.run_id }}
          restore-keys: sofa-data-
      - name: Gerar dados
        run: python -m sofasd.export --out site-data ${{ inputs.treinar && '--treinar' || '' }}
      - name: Guardar banco e modelos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: sofa-data-${{ github.run_id }}
      - name: Publicar no ramo data
        run: |
          cd site-data
          git init -q -b data
          git config user.name "sofa-sd-bot"
          git config user.email "sofa-sd-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados reais $(date '+%d/%m/%Y %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
